<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Novel Search</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; line-height: 1.5; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  h2 { font-size: 1.1rem; margin-top: 28px; margin-bottom: 8px; }
  label { display: block; font-size: 13px; color: #555; margin-top: 8px; margin-bottom: 2px; }
  input[type=text], input[type=url], select { width: 100%; padding: 8px 11px; font-size: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  input:focus, select:focus { outline: none; border-color: #1a6cb3; }
  button { padding: 9px 16px; font-size: 14px; border: 1px solid #333; background: #333; color: #fff; border-radius: 4px; cursor: pointer; }
  button.secondary { background: #fff; color: #333; }
  button.danger { background: #fff; color: #a82626; border-color: #c33; }
  button:hover:not(:disabled) { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .muted { color: #777; font-size: 13px; }
  .result { border: 1px solid #ddd; border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; background: #fafafa; }
  .result.found { border-left: 4px solid #2a9d2a; }
  .result.not_found { border-left: 4px solid #c33; }
  .result.error { border-left: 4px solid #999; }
  .result .site-name { font-weight: 600; }
  .result .body { margin-top: 6px; word-break: break-all; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 6px; }
  .tag.found { background: #e3f5e3; color: #1d6f1d; }
  .tag.not_found { background: #fde3e3; color: #a82626; }
  .tag.error { background: #eee; color: #555; }
  .site-item { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid #eee; border-radius: 4px; margin-bottom: 6px; }
  .site-item .name { font-weight: 600; min-width: 120px; }
  .site-item .url { flex: 1; color: #555; font-size: 13px; word-break: break-all; }
  details { margin-top: 14px; }
  details > summary { cursor: pointer; font-size: 14px; color: #1a6cb3; user-select: none; }
  .add-form { border: 1px solid #ddd; border-radius: 6px; padding: 14px; margin-top: 10px; background: #fafafa; }
  .add-form .field-row { display: flex; gap: 10px; }
  .add-form .field-row > div { flex: 1; }
  a { color: #1a6cb3; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .help { font-size: 12px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<h1>Novel Search</h1>
<p class="muted">Search a novel across your saved sites.</p>

<h2>Your saved sites</h2>
<div id="site-list"></div>

<details id="add-section">
  <summary>+ Add a site</summary>
  <div class="add-form">
    <p class="muted">For 笔趣阁-style sites, the defaults usually work. For others, you may need to inspect the site's search form.</p>
    <label>Display name <span class="muted">(required, unique)</span></label>
    <input id="add-name" type="text" placeholder="e.g. myxs">
    <label>Homepage URL <span class="muted">(optional)</span></label>
    <input id="add-url" type="url" placeholder="https://www.example.com/">
    <label>Search URL <span class="muted">(required — the URL the site posts to when you search)</span></label>
    <input id="add-search-url" type="url" placeholder="https://www.example.com/search.html">
    <div class="field-row">
      <div>
        <label>Method</label>
        <select id="add-method">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
        </select>
      </div>
      <div>
        <label>Query parameter name</label>
        <input id="add-param" type="text" placeholder="s, q, searchkey..." value="q">
      </div>
    </div>
    <label>Result CSS selector <span class="muted">(picks the first result link)</span></label>
    <input id="add-selector" type="text" value="ul.txt-list li span.s2 a">
    <div class="help">笔趣阁-style: <code>ul.txt-list li span.s2 a</code>. 52shuku-style: <code>article.excerpt header a</code>.</div>
    <label>Title selector inside the link <span class="muted">(optional)</span></label>
    <input id="add-title-selector" type="text" placeholder="(leave empty unless title is wrapped in a tag)">
    <label>"Not found" text marker <span class="muted">(optional — substring on the no-results page)</span></label>
    <input id="add-not-found" type="text" placeholder="e.g. 未找到, 没有找到, 找不到">
    <div class="row" style="margin-top:12px;">
      <button id="add-btn">Add site</button>
      <span id="add-status" class="muted"></span>
    </div>
  </div>
</details>

<h2>Search</h2>
<div class="row">
  <input id="novel" type="text" placeholder="Enter novel name, e.g. 斗破苍穹" style="flex:1;">
  <button id="search">Search</button>
</div>
<div id="results" style="margin-top: 20px;"></div>

<script>
async function fetchSites() {
  const r = await fetch("/sites");
  return await r.json();
}

function renderSites(sites) {
  const list = document.getElementById("site-list");
  list.innerHTML = "";
  if (!sites.length) {
    list.innerHTML = '<p class="muted">No sites yet. Add one below.</p>';
    return;
  }
  sites.forEach(s => {
    const div = document.createElement("div");
    div.className = "site-item";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = s.name;
    const link = document.createElement("a");
    link.className = "url";
    link.href = s.url || s.search_url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = s.url || s.search_url;
    const rm = document.createElement("button");
    rm.className = "danger";
    rm.textContent = "Remove";
    rm.onclick = async () => {
      if (!confirm(`Remove "${s.name}"?`)) return;
      const r = await fetch("/sites/" + encodeURIComponent(s.name), { method: "DELETE" });
      if (r.ok) loadAndRenderSites();
      else alert("Failed to remove.");
    };
    div.appendChild(name);
    div.appendChild(link);
    div.appendChild(rm);
    list.appendChild(div);
  });
}

async function loadAndRenderSites() {
  try {
    const sites = await fetchSites();
    renderSites(sites);
  } catch (e) {
    document.getElementById("site-list").innerHTML =
      '<p class="muted">Could not load sites: ' + e.message + '</p>';
  }
}

document.getElementById("add-btn").onclick = async () => {
  const body = {
    name: document.getElementById("add-name").value.trim(),
    url: document.getElementById("add-url").value.trim(),
    search_url: document.getElementById("add-search-url").value.trim(),
    method: document.getElementById("add-method").value,
    param: document.getElementById("add-param").value.trim(),
    result_selector: document.getElementById("add-selector").value.trim(),
    title_selector: document.getElementById("add-title-selector").value.trim(),
    not_found_text: document.getElementById("add-not-found").value.trim(),
  };
  if (!body.name || !body.search_url) {
    alert("Display name and Search URL are required.");
    return;
  }
  const status = document.getElementById("add-status");
  status.textContent = "Adding...";
  try {
    const r = await fetch("/sites", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) { status.textContent = "Error: " + (data.error || "unknown"); return; }
    status.textContent = "Added.";
    ["add-name","add-url","add-search-url","add-param","add-selector","add-title-selector","add-not-found"]
      .forEach(id => document.getElementById(id).value = id === "add-param" ? "q" : (id === "add-selector" ? "ul.txt-list li span.s2 a" : ""));
    document.getElementById("add-section").open = false;
    loadAndRenderSites();
  } catch (e) {
    status.textContent = "Network error: " + e.message;
  }
};

function renderResult(res) {
  const div = document.createElement("div");
  div.className = "result " + res.status;
  const head = document.createElement("div");
  const siteSpan = document.createElement("span");
  siteSpan.className = "site-name";
  siteSpan.textContent = res.site;
  const tag = document.createElement("span");
  tag.className = "tag " + res.status;
  tag.textContent = ({ found: "Found", not_found: "Not found", error: "Error" })[res.status] || res.status;
  head.appendChild(siteSpan);
  head.appendChild(tag);
  div.appendChild(head);

  const body = document.createElement("div");
  body.className = "body";
  if (res.status === "found") {
    const a = document.createElement("a");
    a.href = res.result_url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = res.title || res.result_url;
    body.appendChild(a);
  } else {
    body.textContent = res.message || "";
  }
  div.appendChild(body);
  return div;
}

document.getElementById("search").onclick = async () => {
  const novel = document.getElementById("novel").value.trim();
  if (!novel) { alert("Please enter a novel name."); return; }
  const btn = document.getElementById("search");
  const resultsEl = document.getElementById("results");
  btn.disabled = true; btn.textContent = "Searching...";
  resultsEl.innerHTML = '<p class="muted">Searching...</p>';
  try {
    const r = await fetch("/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ novel }),
    });
    const data = await r.json();
    resultsEl.innerHTML = "";
    if (!data.results) {
      resultsEl.textContent = "Error: " + (data.error || "unknown");
      return;
    }
    if (!data.results.length) {
      resultsEl.innerHTML = '<p class="muted">No sites configured. Add one above.</p>';
      return;
    }
    data.results.forEach(res => resultsEl.appendChild(renderResult(res)));
  } catch (e) {
    resultsEl.textContent = "Network error: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Search";
  }
};

document.getElementById("novel").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("search").click();
});

loadAndRenderSites();
</script>
</body>
</html>
